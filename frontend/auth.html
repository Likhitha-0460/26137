<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q-ROUTE | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-layout">
        <section class="auth-hero">
          <div class="brand-mark"><i class="fa-solid fa-route"></i></div>
          <h1>Smart routing for a live city.</h1>
          <p>Dynamic traffic intelligence for users, route selection, and admin visibility across the whole network.</p>

          <div class="feature-list">
            <div class="feature-item"><span class="feature-dot"></span><span>Optimized route recommendations by traffic level</span></div>
            <div class="feature-item"><span class="feature-dot"></span><span>Live user tracking with admin monitoring</span></div>
            <div class="feature-item"><span class="feature-dot"></span><span>Route choice, email-based account access, and user management</span></div>
          </div>
        </section>

        <section class="auth-panel">
          <div class="auth-tabs">
            <button class="tab-button active" data-tab="login">Login</button>
            <button class="tab-button" data-tab="signup">Create account</button>
          </div>

          <div id="login-panel" class="form-panel active">
            <form id="login-form" class="form-grid">
              <div class="field">
                <label for="login-identifier">Email / Phone / Username</label>
                <input id="login-identifier" type="text" placeholder="Enter your login detail" required />
              </div>
              <div class="field">
                <label for="login-password">Password</label>
                <input id="login-password" type="password" placeholder="Enter password" required />
              </div>
              <button class="primary-btn" type="submit">Login</button>
            </form>
            <div id="login-alert" class="alert error"></div>
          </div>

          <div id="signup-panel" class="form-panel">
            <form id="signup-form" class="form-grid">
              <div class="field">
                <label for="signup-name">Full name</label>
                <input id="signup-name" type="text" placeholder="Your name" required />
              </div>
              <div class="field">
                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" placeholder="your@email.com" required />
              </div>
              <div class="field">
                <label for="signup-phone">Phone number</label>
                <input id="signup-phone" type="tel" placeholder="+91 98765 43210" required />
              </div>
              <div class="field">
                <label for="signup-username">Username</label>
                <input id="signup-username" type="text" placeholder="Choose a username" required />
              </div>
              <div class="field">
                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" placeholder="Create password" required />
              </div>
              <div class="field">
                <label for="signup-role">Role</label>
                <select id="signup-role" style="width:100%;border:1px solid rgba(148,163,184,.25);background:rgba(15,23,42,.45);color:white;border-radius:12px;padding:13px 14px;">
                  <option value="user">User</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <button class="secondary-btn" type="submit">Create account</button>
            </form>
            <div id="signup-alert" class="alert success"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="auth.js"></script>
</body>
</html>
